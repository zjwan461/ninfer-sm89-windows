# Build the three shipped single-card profiles: RTX 4090 (sm_89, 128 SMs),
# RTX 4080 SUPER (sm_89, 80 SMs) and RTX 5060 Ti (sm_120a, 36 SMs).
#
# GitHub-hosted runners have no NVIDIA GPU, so this is a *build* gate: it proves
# the tree compiles and produces binaries, it does not run ctest (most of the
# suite needs a device) and cannot measure performance.
#
# CUDA is not preinstalled on the runner images; the toolkit is installed by the
# job. The repository requires CUDA >= 12.8 (CMakeLists.txt), and sm_120a needs
# 12.8+, so both jobs pin 13.1 to match the local toolchain.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast compile gate: one job per profile inside the same CUDA image the
  # Dockerfile uses. apt supplies ffmpeg/curl, so no vcpkg source build.
  linux:
    name: linux ${{ matrix.label }}
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.1.2-devel-ubuntu24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 4090,   preset: release,        sm: 128, arch: '89' }
          - { label: 4080s,  preset: release-4080s,  sm: 80,  arch: '89' }
          - { label: 5060ti, preset: release-5060ti, sm: 36,  arch: '120a' }
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake ninja-build git pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libcurl4-openssl-dev

      - name: Configure
        run: |
          cmake -S . -B build-${{ matrix.label }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNINFER_BUILD_APPS=ON \
            -DBUILD_TESTING=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF \
            -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.arch }} \
            -DNINFER_TARGET_SM_COUNT=${{ matrix.sm }}

      - name: Build
        run: cmake --build build-${{ matrix.label }} -j "$(nproc)"

      - name: Stage binaries
        run: |
          mkdir -p stage-${{ matrix.label }}
          cp build-${{ matrix.label }}/apps/ninfer* stage-${{ matrix.label }}/
          cp build-${{ matrix.label }}/apps/*.sh stage-${{ matrix.label }}/ 2>/dev/null || true
          ( cd stage-${{ matrix.label }} && sha256sum ninfer* > SHA256SUMS )

      - uses: actions/upload-artifact@v4
        with:
          name: ninfer-linux-${{ matrix.arch }}-${{ matrix.sm }}sm
          path: stage-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 14

  # Release binaries for the supported platform. Windows has no apt ffmpeg, so
  # vcpkg compiles curl/ffmpeg from the manifest: the first run costs 1-2 hours
  # in that step alone. Runs on tags and by hand, not on every pull request.
  windows:
    name: windows ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 4090,   preset: release,        sm: 128, arch: '89' }
          - { label: 4080s,  preset: release-4080s,  sm: 80,  arch: '89' }
          - { label: 5060ti, preset: release-5060ti, sm: 36,  arch: '120a' }
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda
        with:
          cuda: '13.1.0'
          method: 'network'

      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            ${{ github.workspace }}\vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: |
          cmake -S . -B build-${{ matrix.label }} -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DNINFER_BUILD_APPS=ON `
            -DBUILD_TESTING=OFF `
            -DNINFER_BUILD_BENCHMARKS=OFF `
            -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.arch }} `
            -DNINFER_TARGET_SM_COUNT=${{ matrix.sm }}

      - name: Build
        run: cmake --build build-${{ matrix.label }} -j $env:NUMBER_OF_PROCESSORS

      - name: Stage binaries
        shell: pwsh
        run: |
          $stage = "stage-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build-${{ matrix.label }}/apps/ninfer*.exe" $stage
          Copy-Item "build-${{ matrix.label }}/apps/*.bat" $stage
          # vcpkg runtime DLLs (ffmpeg, curl, zlib) next to the executables.
          Get-ChildItem -Recurse "build-${{ matrix.label }}/vcpkg_installed" -Filter *.dll |
            Copy-Item -Destination $stage
          Get-ChildItem $stage -Filter *.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content "$stage/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: ninfer-windows-${{ matrix.arch }}-${{ matrix.sm }}sm
          path: stage-${{ matrix.label }}
          if-no-files-found: error
          retention-days: 30
