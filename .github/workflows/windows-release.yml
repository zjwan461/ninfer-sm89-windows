name: Windows release

# Builds the three qualified compile-time profiles on a v* tag or on demand, and assembles the
# release zip for both. A push to main deliberately does not build: the two paths would queue in
# the same concurrency group and double the wait, so a manual dispatch is the way to check main.
# The hosted runner has no GPU, so this job proves the tree configures, compiles and links for
# sm_89 (128/80 SMs) and sm_120a (36 SMs); kernel correctness still comes from `ctest` on a
# machine with a card.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Assemble the release zip and upload it as an artifact
        type: boolean
        default: true
  push:
    tags: ['v*']

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CUDA_VERSION: 12.8.0
  # One vcpkg install tree and one binary cache shared by the three configure steps: ffmpeg and
  # curl are built once, then extracted for the other two profiles.
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

jobs:
  build:
    # windows-2022 ships MSVC 2022 and Ninja; CUDA is installed below because the image has none.
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Report free disk space
        shell: pwsh
        run: Get-PSDrive C | Select-Object @{ Name = 'FreeGB'; Expression = { [math]::Round($_.Free / 1GB, 1) } }

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          # CUDA 12.8 is the floor CMakeLists.txt enforces and the first release with sm_120a.
          cuda: ${{ env.CUDA_VERSION }}
          method: network

      - name: Show toolchain versions
        shell: pwsh
        run: |
          nvcc --version
          cmake --version
          ninja --version

      - name: Prepare the vcpkg binary cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Configure and build the three profiles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:VCPKG_BINARY_SOURCES = "clear;files,$($env:VCPKG_DEFAULT_BINARY_CACHE),readwrite"
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          $toolchain = Join-Path $vcpkgRoot 'scripts\buildsystems\vcpkg.cmake'

          # The presets carry the build options; the toolchain path is per machine and stays here.
          # Each preset is built to completion before the next one starts, so only one object tree
          # of the three occupies disk at a time.
          foreach ($preset in @('release', 'release-4080s', 'release-5060ti')) {
            Write-Host "::group::configure $preset"
            cmake --preset $preset "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DVCPKG_TARGET_TRIPLET=x64-windows
            if ($LASTEXITCODE -ne 0) { throw "configure failed for $preset" }
            Write-Host "::endgroup::"

            Write-Host "::group::build $preset"
            cmake --build --preset $preset
            if ($LASTEXITCODE -ne 0) { throw "build failed for $preset" }
            Write-Host "::endgroup::"
          }

      - name: Package the release archive
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.package)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\package-release-v061-sm89.ps1 -Cards @('rtx4090', 'rtx4080s', 'rtx5060ti')
          Get-ChildItem dist -File | Select-Object Name, Length

      - name: Upload the archive
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.package)
        uses: actions/upload-artifact@v4
        with:
          name: ninfer-windows-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS-v*-sm89.txt
          if-no-files-found: error
          retention-days: 14

      - name: Attach the archive to the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like 'SHA256SUMS*.txt' }
          if ($assets.Count -eq 0) { throw 'no release assets were produced' }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "could not create release $tag" }
          }
          gh release upload $tag $assets.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not upload assets for $tag" }
